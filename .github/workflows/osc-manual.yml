            exit 1
          fi
          printf 'checked-out SHA: %s\n' "$checked_out_sha"

      - name: make lint/docs
        run: make lint/docs
        env:
          # Fork dispatch deviation: the PR path diffs against
          # origin/github.base_ref, which does not exist on workflow_dispatch.
          # Diff docs/comment word budgets against the fork's main (identical
          # to upstream main at dispatch time).
          BASE_REF: origin/main

  ci-pass:
    needs:
      [
        proto-check,
        build-api,
        build-grafana,
        build-kobo-gateway,
        lint-go,
        lint-sql,
        lint-migrations,
        lint-kamal-secrets,
        web-lint,
        kobo-gateway-lint,
        sentrytools-lint,
        infra-lint,
        api-test,
        web-test,
        sentrytools-test,
        conflict-markers,
        workflow-lint,
        skills-lint,
        docs-lint,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job failed with result: $result"
              exit 1
            fi
          done
      # Codecov wait step deliberately dropped (see header): the upstream step
      # needs CODECOV_TOKEN and polls the upstream project's checks.
